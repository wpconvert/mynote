<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Files</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-soft: #f8f9fb;
    --text: #17181c;
    --text-soft: #555b66;
    --muted: #8a909a;
    --border: #e8eaf0;
    --primary: #111318;
    --primary-hover: #292c33;
    --danger: #e5484d;
    --sidebar-width: 250px;
    --radius: 14px;
    --radius-lg: 20px;
    --shadow: 0 8px 30px rgba(20, 24, 32, .06);
}

html,
body {
    min-height: 100%;
}

body {
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    transition: background .25s ease, color .25s ease;
}

button,
input {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;
}

.hidden {
    display: none !important;
}

.app {
    min-height: 100vh;
    display: flex;
}

.sidebar {
    width: var(--sidebar-width);
    height: 100vh;
    position: fixed;
    inset: 0 auto 0 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 50;
    transition: transform .25s ease;
}

.logo {
    height: 76px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -.5px;
}

.logo-mark {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: var(--primary);
    color: #fff;
    display: grid;
    place-items: center;
    margin-right: 11px;
    font-size: 15px;
}

.sidebar-content {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px 18px;
}

.sidebar-label {
    padding: 0 10px;
    margin: 18px 0 8px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .12em;
    color: var(--muted);
}

.nav-item {
    width: 100%;
    min-height: 42px;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 0 11px;
    margin-bottom: 3px;
    border-radius: 10px;
    color: var(--text-soft);
    background: transparent;
    text-align: left;
    transition: background .18s ease, color .18s ease;
}

.nav-item:hover {
    background: var(--surface-soft);
    color: var(--text);
}

.nav-item.active {
    background: #f0f1f4;
    color: var(--text);
    font-weight: 600;
}

.nav-icon {
    width: 20px;
    text-align: center;
    font-size: 15px;
}

.folder-nav {
    max-height: 230px;
    overflow-y: auto;
}

.sidebar-bottom {
    padding: 14px;
    border-top: 1px solid var(--border);
}

.storage-box {
    padding: 14px;
    border-radius: 13px;
    background: var(--surface-soft);
}

.storage-title {
    display: flex;
    justify-content: space-between;
    margin-bottom: 9px;
    font-size: 12px;
    font-weight: 600;
}

.storage-bar {
    width: 100%;
    height: 5px;
    background: var(--border);
    border-radius: 20px;
    overflow: hidden;
}

.storage-fill {
    width: 38%;
    height: 100%;
    background: var(--primary);
    border-radius: inherit;
}

.main {
    width: calc(100% - var(--sidebar-width));
    margin-left: var(--sidebar-width);
    min-height: 100vh;
}

.topbar {
    height: 76px;
    background: rgba(255, 255, 255, .88);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 30px;
    position: sticky;
    top: 0;
    z-index: 30;
}

.mobile-menu {
    display: none;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--surface-soft);
    color: var(--text);
}

.search {
    flex: 1;
    max-width: 560px;
    position: relative;
}

.search input {
    width: 100%;
    height: 42px;
    border: 1px solid var(--border);
    background: var(--surface-soft);
    border-radius: 11px;
    outline: none;
    padding: 0 15px 0 40px;
    color: var(--text);
    transition: .18s ease;
}

.search input:focus {
    background: var(--surface);
    border-color: #cfd3da;
    box-shadow: 0 0 0 4px rgba(17, 19, 24, .04);
}

.search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
}

.topbar-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
}

.icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: transparent;
    color: var(--text-soft);
    transition: .18s ease;
}

.icon-btn:hover {
    background: var(--surface-soft);
    color: var(--text);
}

.profile {
    height: 40px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 10px 0 5px;
    border-radius: 11px;
    background: transparent;
    color: var(--text);
}

.profile:hover {
    background: var(--surface-soft);
}

.avatar {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: #e9ebef;
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 700;
}

.content {
    max-width: 1450px;
    margin: 0 auto;
    padding: 34px 30px 50px;
}

.page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 30px;
}

.page-title {
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -.7px;
    font-weight: 700;
}

.page-description {
    margin-top: 7px;
    font-size: 14px;
    color: var(--text-soft);
}

.actions {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
}

.btn {
    min-height: 40px;
    padding: 0 15px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
}

.btn:active {
    transform: scale(.97);
}

.btn-primary {
    background: var(--primary);
    color: #fff;
}

.btn-primary:hover {
    background: var(--primary-hover);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .10);
}

.btn-secondary {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
}

.btn-secondary:hover {
    background: var(--surface-soft);
}

.section {
    margin-bottom: 34px;
}

.section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
}

.section-title {
    font-size: 14px;
    font-weight: 700;
}

.section-link {
    background: transparent;
    color: var(--text-soft);
    font-size: 12px;
}

.folder-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
}

.folder-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 17px;
    min-height: 128px;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease, border .18s ease;
}

.folder-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
    border-color: #dde0e6;
}

.folder-icon {
    width: 43px;
    height: 43px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: #f0f1f4;
    font-size: 19px;
    margin-bottom: 19px;
}

.folder-name {
    font-size: 14px;
    font-weight: 650;
}

.folder-meta {
    margin-top: 4px;
    color: var(--muted);
    font-size: 11px;
}

.file-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
}

.file-row {
    min-height: 66px;
    display: grid;
    grid-template-columns: minmax(220px, 2fr) 120px 120px 44px;
    align-items: center;
    gap: 14px;
    padding: 0 18px;
    border-bottom: 1px solid var(--border);
    transition: background .16s ease;
}

.file-row:last-child {
    border-bottom: 0;
}

.file-row:hover {
    background: var(--surface-soft);
}

.file-header {
    min-height: 42px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
}

.file-info {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
}

.file-icon {
    width: 38px;
    height: 38px;
    flex: 0 0 38px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    background: var(--surface-soft);
    font-size: 15px;
}

.file-name {
    min-width: 0;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.file-note {
    margin-top: 3px;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.file-type,
.file-date {
    font-size: 12px;
    color: var(--text-soft);
}

.more-btn {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    font-size: 17px;
}

.more-btn:hover {
    background: var(--surface-soft);
    color: var(--text);
}

.empty {
    padding: 65px 20px;
    text-align: center;
}

.empty-icon {
    width: 52px;
    height: 52px;
    margin: 0 auto 14px;
    border-radius: 15px;
    display: grid;
    place-items: center;
    background: var(--surface-soft);
    font-size: 22px;
}

.empty-title {
    font-size: 15px;
    font-weight: 700;
}

.empty-text {
    margin-top: 6px;
    color: var(--muted);
    font-size: 12px;
}

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 17, 21, .38);
    backdrop-filter: blur(5px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
    opacity: 0;
    visibility: hidden;
    transition: opacity .2s ease;
}

.modal-overlay.show {
    opacity: 1;
    visibility: visible;
}

.modal {
    width: min(460px, 100%);
    background: var(--surface);
    border-radius: 18px;
    box-shadow: 0 25px 70px rgba(0, 0, 0, .18);
    transform: translateY(12px) scale(.98);
    transition: transform .2s ease;
    overflow: hidden;
}

.modal-overlay.show .modal {
    transform: translateY(0) scale(1);
}

.modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 21px 22px 15px;
}

.modal-title {
    font-size: 16px;
    font-weight: 700;
}

.modal-close {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
}

.modal-close:hover {
    background: var(--surface-soft);
    color: var(--text);
}

.modal-body {
    padding: 5px 22px 22px;
}

.form-label {
    display: block;
    margin-bottom: 7px;
    font-size: 12px;
    font-weight: 600;
}

.form-input {
    width: 100%;
    height: 43px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    background: var(--surface-soft);
    color: var(--text);
}

.form-input:focus {
    border-color: #c9cdd5;
    box-shadow: 0 0 0 4px rgba(17, 19, 24, .04);
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding-top: 20px;
}

.drop-zone {
    display: block;
    border: 1.5px dashed #d7dae0;
    border-radius: 14px;
    padding: 34px 20px;
    text-align: center;
    background: var(--surface-soft);
    cursor: pointer;
    transition: .18s ease;
}

.drop-zone:hover,
.drop-zone.dragging {
    border-color: #aab0ba;
    background: #f0f1f4;
}

.drop-icon {
    font-size: 25px;
    margin-bottom: 10px;
}

.drop-title {
    font-size: 13px;
    font-weight: 650;
}

.drop-text {
    margin-top: 5px;
    color: var(--muted);
    font-size: 11px;
}

.context-menu {
    position: fixed;
    width: 190px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 15px 45px rgba(0, 0, 0, .14);
    z-index: 200;
    opacity: 0;
    visibility: hidden;
    transform: scale(.96);
    transform-origin: top left;
    transition: .12s ease;
}

.context-menu.show {
    opacity: 1;
    visibility: visible;
    transform: scale(1);
}

.context-item {
    width: 100%;
    height: 36px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 10px;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font-size: 12px;
    text-align: left;
}

.context-item:hover {
    background: var(--surface-soft);
}

.context-item.danger {
    color: var(--danger);
}

.account-menu {
    position: fixed;
    width: 190px;
    right: 25px;
    top: 65px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 6px;
    box-shadow: 0 15px 45px rgba(0, 0, 0, .13);
    z-index: 90;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-5px);
    transition: .16s ease;
}

.account-menu.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.account-item {
    width: 100%;
    height: 38px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 10px;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    text-align: left;
    font-size: 12px;
}

.account-item:hover {
    background: var(--surface-soft);
}

.account-item.danger {
    color: var(--danger);
}

.settings-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
}

.settings-row {
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
}

.settings-row:last-child {
    border-bottom: 0;
}

.settings-title {
    font-size: 13px;
    font-weight: 600;
}

.settings-description {
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
}

.toggle {
    width: 42px;
    height: 24px;
    border-radius: 20px;
    background: #dfe2e7;
    position: relative;
}

.toggle::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    top: 3px;
    left: 3px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.15);
    transition: transform .2s ease;
}

.toggle.active {
    background: var(--primary);
}

.toggle.active::after {
    transform: translateX(18px);
}

body.dark {
    --bg: #111214;
    --surface: #18191c;
    --surface-soft: #202125;
    --text: #f4f5f7;
    --text-soft: #b0b4bc;
    --muted: #777c86;
    --border: #292b31;
    --primary: #f4f5f7;
    --primary-hover: #ffffff;
    --danger: #ff6b72;
    --shadow: 0 10px 35px rgba(0, 0, 0, .25);
}

body.dark .btn-primary {
    color: #111214;
}

body.dark .logo-mark {
    color: #111214;
}

body.dark .nav-item.active,
body.dark .folder-icon {
    background: #26282d;
}

body.dark .avatar {
    background: #282a2f;
}

body.dark .topbar {
    background: rgba(24, 25, 28, .88);
}

body.dark .storage-fill {
    background: #f4f5f7;
}

.loading {
    padding: 70px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
}

.spinner {
    width: 26px;
    height: 26px;
    border: 2px solid var(--border);
    border-top-color: var(--text);
    border-radius: 50%;
    margin: 0 auto 12px;
    animation: spin .7s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.toast-container {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 300;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.toast {
    min-width: 240px;
    max-width: 340px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--surface);
    box-shadow: 0 12px 35px rgba(0, 0, 0, .12);
    color: var(--text);
    font-size: 12px;
    animation: toastIn .22s ease;
}

.note-modal {
    width: min(900px, 100%);
}

.note-editor {
    width: 100%;
    min-height: 430px;
    resize: vertical;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    background: var(--surface-soft);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 13px;
    line-height: 1.65;
}

.note-editor:focus {
    background: var(--surface);
    border-color: #c9cdd5;
    box-shadow: 0 0 0 4px rgba(17, 19, 24, .04);
}

.link-url {
    color: var(--text-soft);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 3px;
}

.subfolder-section {
    margin-bottom: 30px;
}

.subfolder-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
}

.subfolder-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 11px;
    transition: .18s ease;
}

.subfolder-card:hover {
    background: var(--surface-soft);
    transform: translateY(-1px);
}

.subfolder-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--surface-soft);
    display: grid;
    place-items: center;
    flex: 0 0 38px;
}

@media (max-width: 700px) {
    .subfolder-grid {
        grid-template-columns: 1fr;
    }

    .note-modal {
        width: 100%;
    }

    .note-editor {
        min-height: 320px;
    }
}

@keyframes toastIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 1100px) {
    .folder-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 800px) {
    .sidebar {
        transform: translateX(-100%);
        box-shadow: 15px 0 40px rgba(0,0,0,.08);
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .main {
        width: 100%;
        margin-left: 0;
    }

    .mobile-menu {
        display: block;
    }

    .topbar {
        padding: 0 16px;
    }

    .content {
        padding: 25px 16px 40px;
    }

    .page-head {
        align-items: flex-start;
        flex-direction: column;
    }

    .actions {
        width: 100%;
    }

    .actions .btn {
        flex: 1;
    }

    .file-header {
        display: none;
    }

    .file-row {
        grid-template-columns: minmax(0, 1fr) 38px;
        padding: 10px 14px;
        min-height: 62px;
    }

    .file-type,
    .file-date {
        display: none;
    }

    .profile span {
        display: none;
    }
}

@media (max-width: 520px) {
    .folder-grid {
        grid-template-columns: 1fr;
    }

    .page-title {
        font-size: 24px;
    }

    .topbar-actions .icon-btn {
        display: none;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar" id="sidebar">

        <div class="logo">
            <div class="logo-mark">M</div>
            My Files
        </div>

        <div class="sidebar-content">

            <div class="sidebar-label">MY FILES</div>

            <button class="nav-item active" data-page="Home" onclick="navigate('Home')">
                <span class="nav-icon">⌂</span>
                <span>Home</span>
            </button>

            <button class="nav-item" data-page="Favorites" onclick="navigate('Favorites')">
                <span class="nav-icon">☆</span>
                <span>Favorites</span>
            </button>

            <button class="nav-item" data-page="Recent" onclick="navigate('Recent')">
                <span class="nav-icon">◷</span>
                <span>Recent</span>
            </button>

            <div class="sidebar-label">FOLDERS</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbyaXjW5Uanl8eA6tGF7KQskT0i1Qfjcrve0KVh-rlwyrUg-9fd78YFXq3VIAOQaTsnp/exec";

const state = {
    user: sessionStorage.getItem("myFilesUser") || "User",
    page: "Home",
    currentFolder: "ROOT",
    theme: localStorage.getItem("myFilesTheme") || "light",
    search: "",
    selectedItem: null,
    folders: [],
    files: [],
    trash: []
};

let selectedUploadFile = null;

document.addEventListener("DOMContentLoaded", async () => {
    applyTheme();
    updateUser();

    document.addEventListener("click", event => {
        if (!event.target.closest(".context-menu")) {
            hideContextMenu();
        }

        if (
            !event.target.closest(".profile") &&
            !event.target.closest(".account-menu")
        ) {
            closeAccountMenu();
        }
    });

    document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
            closeModal();
            hideContextMenu();
            closeAccountMenu();
        }
    });

    await loadData();
});

function apiGet(action) {
    return new Promise((resolve, reject) => {
        const callbackName =
            "mynote_" + Date.now() + "_" +
            Math.random().toString(36).slice(2);

        const script = document.createElement("script");
        let finished = false;

        const timer = setTimeout(() => {
            finish();
            reject(new Error("GAS tidak merespons."));
        }, 15000);

        function finish() {
            if (finished) return;
            finished = true;
            clearTimeout(timer);
            delete window[callbackName];
            script.remove();
        }

        window[callbackName] = data => {
            if (finished) return;

            if (!data || data.success === false) {
                finish();
                reject(new Error(data?.message || "Gagal mengambil data."));
                return;
            }

            finish();
            resolve(data);
        };

        const separator = GAS_URL.includes("?") ? "&" : "?";

        script.src =
            GAS_URL +
            separator +
            "action=" + encodeURIComponent(action) +
            "&callback=" + encodeURIComponent(callbackName);

        script.onerror = () => {
            finish();
            reject(new Error("Gagal menghubungi MYNOTE."));
        };

        document.body.appendChild(script);
    });
}

async function apiPost(action, data = {}) {
    const payload = JSON.stringify({
        action,
        ...data
    });

    try {
        await fetch(GAS_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: payload
        });

        return { success: true };
    } catch (error) {
        throw new Error("Gagal mengirim perubahan ke MYNOTE.");
    }
}

async function loadData() {
    try {
        const [filesResponse, foldersResponse] = await Promise.all([
            apiGet("getFiles"),
            apiGet("getFolders")
        ]);

        if (!filesResponse.success) {
            throw new Error(filesResponse.message || "Gagal mengambil file.");
        }

        if (!foldersResponse.success) {
            throw new Error(foldersResponse.message || "Gagal mengambil folder.");
        }

        state.files = (filesResponse.files || []).filter(
            file => file.status !== "DELETED"
        );

        state.trash = state.files.filter(
            file => file.status === "TRASH"
        );

        state.files = state.files.filter(
            file => file.status !== "TRASH"
        );

        state.folders = foldersResponse.folders || [];

        renderFolderNav();
        renderContent();
        updateStorage();

    } catch (error) {
        console.error(error);

        document.getElementById("content").innerHTML = `
            <div class="empty">
                <div class="empty-icon">!</div>
                <div class="empty-title">Unable to connect</div>
                <div class="empty-text">
                    ${escapeHTML(error.message)}
                </div>

                <div style="margin-top:18px;">
                    <button class="btn btn-primary" onclick="loadData()">
                        Try again
                    </button>
                </div>
            </div>
        `;
    }
}

function updateUser() {
    const name = state.user || "User";

    document.getElementById("username").textContent = name;
    document.getElementById("avatar").textContent =
        name.charAt(0).toUpperCase();
}

function renderFolderNav() {
    const nav = document.getElementById("folderNav");
    const folders = state.folders.filter(folder => String(folder.parent_id || "ROOT") === "ROOT");

    if (!folders.length) {
        nav.innerHTML = `
            <div style="
                padding:8px 10px;
                color:var(--muted);
                font-size:11px;
            ">

        `;
        return;
    }

    nav.innerHTML = folders.map(folder => `
        <button
            class="nav-item"
            data-folder="${escapeAttribute(folder.id)}"
            onclick="openFolder('${escapeAttribute(folder.id)}')"
        >
            <span class="nav-icon">📁</span>
            <span>${escapeHTML(folder.name)}</span>
        </button>
    `).join("");
}

function updateActiveNav() {
    document.querySelectorAll(".nav-item").forEach(item => {
        item.classList.remove("active");
    });

    if (state.currentFolder !== "ROOT") {
        const folderButton = document.querySelector(
            `.nav-item[data-folder="${CSS.escape(state.currentFolder)}"]`
        );

        if (folderButton) {
            folderButton.classList.add("active");
            return;
        }
    }

    const pageButton = document.querySelector(
        `.nav-item[data-page="${CSS.escape(state.page)}"]`

    if (pageButton) {
        pageButton.classList.add("active");
    }
}

function navigate(page) {
    state.page = page;

    updateActiveNav();
    renderContent();

    toggleSidebar(false);
}

function openFolder(folderId) {
    const folder = state.folders.find(item => item.id === folderId);

    if (!folder) return;

    state.page = folder.name;
    state.currentFolder = folderId;

    updateActiveNav();
    renderContent();
    toggleSidebar(false);
}

function renderContent() {
    if (state.page === "Home") {
        renderHome();
        return;
    }

    if (state.page === "Favorites") {
        renderFavorites();
        return;
    }

    if (state.page === "Recent") {
        renderRecent();
        return;
    }

    if (state.page === "Trash") {
        renderTrash();
        return;
    }

    if (state.page === "Settings") {
        renderSettings();
        return;
    }

    renderFolderPage();
}

function renderHome() {
    const folders = state.folders.filter(folder =>
        String(folder.parent_id || "ROOT") === "ROOT" &&
        matchesSearch(folder.name)

            matchesSearch(file.note)

                    ? folders.map(folderCard).join("")

function renderFolderPage() {
    const folder = state.folders.find(
        item => item.id === state.currentFolder
    );

    if (!folder) {
        document.getElementById("content").innerHTML =
            emptyState("Folder not found.", "The folder may have been removed.");
        return;
    }

    const childFolders = state.folders.filter(item =>
        String(item.parent_id || "") === String(folder.id) &&
        matchesSearch(item.name)
    );

    const files = state.files.filter(file =>
        file.folder_id === folder.id &&
        (
            matchesSearch(file.name) ||
            matchesSearch(file.note) ||
            matchesSearch(file.url)
        )
    );

    const breadcrumbs = [];
    let cursor = folder;
    while (cursor) {
        breadcrumbs.unshift(cursor);
        cursor = state.folders.find(item => String(item.id) === String(cursor.parent_id));
    }

    document.getElementById("content").innerHTML = `
        <div class="breadcrumb">
            <button onclick="navigate('Home')">Home</button>
            ${breadcrumbs.map((item, index) => `
                <span>›</span>
                ${index === breadcrumbs.length - 1
                    ? `<span class="current">${escapeHTML(item.name)}</span>`
                    : `<button onclick="openFolder('${escapeAttribute(item.id)}')">${escapeHTML(item.name)}</button>`}
            `).join("")}
        </div>

        <div class="page-head">
            <div>
                <h1 class="page-title">${escapeHTML(folder.name)}</h1>
                <p class="page-description">
                    ${childFolders.length} folder${childFolders.length === 1 ? "" : "s"} · ${files.length} item${files.length === 1 ? "" : "s"}
                </p>
            </div>

            <div class="actions">
                <button class="btn btn-secondary" onclick="openUploadModal()">

                </button>
                <button class="btn btn-primary" onclick="openFolderModal()">

        </div>

        ${childFolders.length ? `
            <section class="subfolder-section">
                <div class="section-head">
                    <h2 class="section-title">Folders</h2>
                </div>
                <div class="subfolder-grid">
                    ${childFolders.map(subfolderCard).join("")}

            </section>
        ` : ""}

        <div class="file-panel">
            ${fileList(files)}
        </div>
    `;
}

function subfolderCard(folder) {
    const count = state.files.filter(file => file.folder_id === folder.id).length;
    return `
        <div class="subfolder-card" onclick="openFolder('${escapeAttribute(folder.id)}')">

            <div style="min-width:0">

}

            <div>
                <h1 class="page-title">Favorites</h1>

}

}

function renderSettings() {
    document.getElementById("content").innerHTML = `
        <div class="page-head">
            <div>
                <h1 class="page-title">Settings</h1>
                <p class="page-description">
                    Customize your file manager.
                </p>
            </div>
        </div>

        <div class="settings-card">

            <div class="settings-row">
                <div>

                    <div class="settings-description">

                    </div>

                    class="toggle ${state.theme === "dark" ? "active" : ""}"

            </div>

            <div class="settings-row">

                    Google Drive
                </span>
            </div>

        </div>
    `;
}

function folderCard(folder) {
    const count = state.files.filter(
        file => file.folder_id === folder.id
    ).length;

    return `
        <div
            class="folder-card"
            onclick="openFolder('${escapeAttribute(folder.id)}')"
        >
            <div class="folder-icon">📁</div>

            <div class="folder-name">
                ${escapeHTML(folder.name)}
            </div>

            <div class="folder-meta">
                ${count} file${count === 1 ? "" : "s"}
            </div>
        </div>
    `;
}

function fileList(files, isTrash = false) {
    if (!files.length) {
        return emptyState(
            "No files found.",
            "Upload a file or try another search."
        );
    }

    return `
        <div class="file-row file-header">
            <div>Name</div>
            <div>Type</div>
            <div>Date</div>
            <div></div>
        </div>

        ${files.map(file => `
            <div
                class="file-row"
                onclick="openFileItem(event, '${escapeAttribute(file.id)}', ${isTrash})"
                oncontextmenu="openFileContext(event, '${escapeAttribute(file.id)}', ${isTrash})"
            >
                <div class="file-info">

                    <div class="file-icon">
                        ${getFileIcon(file.type)}
                    </div>

                    <div style="min-width:0">

                        <div class="file-name">
                            ${file.type === "LINK" && file.url
                                ? `<span style="cursor:pointer">${escapeHTML(file.name)}</span>`
                                : escapeHTML(file.name)}
                        </div>

                        ${file.type === "LINK" && file.url
                            ? `<div class="link-url">${escapeHTML(file.url)}</div>`
                            : `<div class="file-note">${escapeHTML(file.note || "No note")}</div>`}

                    </div>

                </div>

                <div class="file-type">
                    ${escapeHTML(file.type || "FILE")}
                </div>

                <div class="file-date">
                    ${formatDate(file.created_at)}
                </div>

                <button
                    class="more-btn"
                    onclick="openFileContext(event, '${escapeAttribute(file.id)}', ${isTrash})"
                >
                    ⋯
                </button>

            </div>
        `).join("")}
    `;
}

function getFileIcon(type) {
    const icons = {
        HTML: "◇",
        HTM: "◇",
        JS: "◈",
        CSS: "◇",
        JSON: "{}",
        MD: "≡",
        TXT: "≡",
        ZIP: "▣",
        RAR: "▣",
        PDF: "▤",
        JPG: "▧",
        JPEG: "▧",
        PNG: "▧",
        GIF: "▧",
        WEBP: "▧",
        SVG: "◇",
        MP4: "▶",
        MOV: "▶",
        MP3: "♪"
    };

    return icons[String(type || "").toUpperCase()] || "□";
}

function emptyState(title, text) {
    return `
        <div class="empty">
            <div class="empty-icon">□</div>
            <div class="empty-title">${escapeHTML(title)}</div>
            <div class="empty-text">${escapeHTML(text)}</div>
        </div>
    `;
}

function matchesSearch(value) {
    if (!state.search) return true;

    return String(value || "")
        .toLowerCase()
        .includes(state.search.toLowerCase());
}

function handleSearch(value) {
    state.search = value.trim();
    renderContent();
}

function openFolderModal() {
    showModal(`
        <div class="modal-head">
            <div class="modal-title">New folder</div>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>

        <div class="modal-body">

            <label class="form-label">
                Folder name
            </label>

            <input
                id="folderName"
                class="form-input"
                type="text"
                placeholder="Enter folder name"
                autocomplete="off"
            >

            <div class="modal-actions">

                <button class="btn btn-secondary" onclick="closeModal()">
                    Cancel
                </button>

                <button class="btn btn-primary" onclick="createFolder()">
                    Create folder
                </button>

            </div>

        </div>
    `);

    setTimeout(() => {
        document.getElementById("folderName")?.focus();
    }, 80);
}

async function createFolder() {
    const input = document.getElementById("folderName");
    const name = input?.value.trim();

    if (!name) {
        toast("Please enter a folder name.");
        return;
    }

    try {
        closeModal();
        toast("Creating folder...");

        const response = await apiPost("createFolder", {
            name,
            parent_id: state.currentFolder !== "ROOT" ? state.currentFolder : "1qiQodooK5aNdDfzBASq2eFQVaCshtPlz"
        });

        toast("Folder created.");
        await new Promise(resolve => setTimeout(resolve, 700));
        await loadData();

    } catch (error) {
        toast(error.message);
    }
}

function openUploadModal() {
    showModal(`
        <div class="modal-head">
            <div class="modal-title">Upload file</div>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>

        <div class="modal-body">

            <label class="drop-zone" id="dropZone">

                <div class="drop-icon">↑</div>

                <div class="drop-title">
                    Choose a file
                </div>

                <div class="drop-text">
                    Images, documents, ZIP files and more
                </div>

                <input
                    id="fileInput"
                    type="file"
                    hidden
                >

            </label>

            <div
                id="selectedFile"
                style="
                    margin-top:12px;
                    font-size:12px;
                    color:var(--text-soft);
                "
            >
            </div>

            <div class="modal-actions">

                <button class="btn btn-secondary" onclick="closeModal()">
                    Cancel
                </button>

                <button class="btn btn-primary" onclick="uploadFileToDrive()">
                    Upload
                </button>

            </div>

        </div>
    `);

    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");

    dropZone.addEventListener("click", () => {
        fileInput.click();
    });

    fileInput.addEventListener("change", event => {
        const file = event.target.files[0];

        if (file) {
            selectedUploadFile = file;
            showSelectedFile(file);
        }
    });

    dropZone.addEventListener("dragover", event => {
        event.preventDefault();
        dropZone.classList.add("dragging");
    });

    dropZone.addEventListener("dragleave", () => {
        dropZone.classList.remove("dragging");
    });

    dropZone.addEventListener("drop", event => {
        event.preventDefault();
        dropZone.classList.remove("dragging");

        const file = event.dataTransfer.files[0];

        if (file) {
            selectedUploadFile = file;
            showSelectedFile(file);
        }
    });
}

function showSelectedFile(file) {
    const box = document.getElementById("selectedFile");

    if (!box) return;

    const size = formatBytes(file.size);

    box.textContent = `${file.name} · ${size}`;
}

async function uploadFileToDrive() {
    if (!selectedUploadFile) {
        toast("Please choose a file first.");
        return;
    }

    const file = selectedUploadFile;

    try {
        toast("Uploading...");

        const base64 = await fileToBase64(file);

        const folderId =
            state.currentFolder !== "ROOT"
            ? state.currentFolder
            : "1qiQodooK5aNdDfzBASq2eFQVaCshtPlz";

        const extension = file.name.includes(".")
            ? file.name.split(".").pop().toUpperCase()
            : "FILE";

        const response = await apiPost("uploadFile", {
            name: file.name,
            type: extension,
            folder_id: folderId,
            mime_type: file.type || "application/octet-stream",
            file_base64: base64
        });

        selectedUploadFile = null;

        closeModal();

        toast("File uploaded successfully.");
        await new Promise(resolve => setTimeout(resolve, 700));
        await loadData();

    } catch (error) {
        console.error(error);
        toast(error.message);
    }
}

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => {
            const result = String(reader.result);

            const base64 = result.includes(",")
                ? result.split(",")[1]
                : result;

            resolve(base64);
        };

        reader.onerror = () => {
            reject(new Error("Unable to read the file."));
        };

        reader.readAsDataURL(file);
    });
}

    let x = event.clientX;
    let y = event.clientY;

    if (x + 190 > window.innerWidth) {
        x = window.innerWidth - 200;
    }

    if (y + 255 > window.innerHeight) {
        y = window.innerHeight - 265;
    }

    menu.style.left = `${Math.max(8, x)}px`;
    menu.style.top = `${Math.max(8, y)}px`;

    menu.classList.add("show");
}

function updateStorage() {

    const percent = Math.min(
        100,
        count === 0
        ? 0
        : Math.max(3, Math.min(95, count * 3))
    );

    document.getElementById("storageText").textContent =
        `${percent}%`;

    document.getElementById("storageFill").style.width =
        `${percent}%`;
}

function formatDate(value) {
    if (!value) return "-";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return String(value);
    }

    return date.toLocaleDateString(
        undefined,
        {
            month: "short",
            day: "numeric",
            year: "numeric"
        }
    );
}

function formatBytes(bytes) {
    if (!bytes) return "0 B";

    const units = [
        "B",
        "KB",
        "MB",
        "GB",
        "TB"
    ];

    const index = Math.floor(
        Math.log(bytes) / Math.log(1024)
    );

    return (
        bytes /
        Math.pow(1024, index)
    ).toFixed(index === 0 ? 0 : 1)
    + " "
    + units[index];
}

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function escapeAttribute(value) {
    return escapeHTML(value)
        .replaceAll("\\", "&#92;");
}
